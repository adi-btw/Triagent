[project]
name = "incident-triage-assistant"
version = "0.1.0"
description = "RAG + agentic incident triage assistant with citation validation and evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "fastembed>=0.4",
    "google-genai>=1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Commands run from the repo root (python -m scripts.ingest, uvicorn app.main:app).
# `pip install -e ".[dev]"` installs the dependencies; the package list stays explicit
# because data/, docs/ and migrations/ are not Python packages.
[tool.setuptools.packages.find]
include = ["app*", "eval*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: needs network, an embedding model download, or an LLM API key",
    "postgres: needs a running Postgres with pgvector (docker compose up -d)",
]
addopts = "-m 'not slow and not postgres'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
