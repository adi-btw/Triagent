name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never calls an LLM: the fake provider keeps every job free and deterministic.
  LLM_PROVIDER: fake
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Lint and unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Prompt-injection red team (worst-case model, no LLM)
        run: python -m eval.redteam --check

  retrieval:
    name: Retrieval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Build the index (real embedding model)
        run: python -m scripts.ingest
      - name: Gate on recall / primary-doc hit / MRR
        run: python -m eval.retrieval_gate
      - name: Demo-incident ranking tests
        run: pytest -q -m slow tests/test_retrieval_demo.py
      - name: Full retrieval report
        run: python -m eval.retrieval_eval --modes vector keyword hybrid
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: eval/results/retrieval-latest.md

  postgres:
    name: Postgres + pgvector integration
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://triage:triage@localhost:5432/triage
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Store integration tests
        run: pytest -q -m postgres
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Ingest the corpus into Postgres and run the retrieval gate on it
        env:
          STORE_BACKEND: postgres
        run: |
          python -m scripts.ingest --backend postgres
          python -m eval.retrieval_gate

  docker:
    name: Docker image (build + demo smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t triagent:ci .
      - name: Start (key-free demo, exactly as deployed)
        run: |
          docker run -d --name app -p 7860:7860 triagent:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:7860/health > health.json 2>/dev/null && break
            sleep 2
          done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['index_ok'] and h['demo_mode'], h"
      - name: Sample incidents are served from the baked-in demo cache
        # There is no API key, so any answer that is not pre-computed would fail.
        run: |
          docker exec app python - <<'PY'
          import json, urllib.request
          from scripts.seed_demo_cache import sample_incidents
          samples = sample_incidents(open("app/static/app.js", encoding="utf-8").read())
          for name, incident in samples.items():
              for mode in ("no_retrieval", "rag", "agent"):
                  req = urllib.request.Request(
                      "http://localhost:7860/triage",
                      data=json.dumps({"incident": incident, "mode": mode}).encode(),
                      headers={"Content-Type": "application/json"},
                  )
                  body = json.load(urllib.request.urlopen(req, timeout=60))
                  print(name, mode, body["status"])
                  assert body["status"] == "ok", body
          PY
      - name: Custom incidents are refused (no model can be called)
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST localhost:7860/triage             -H 'Content-Type: application/json'             -d '{"incident": "a brand new incident that was never pre-computed", "mode": "rag"}')
          cat body.json; echo
          test "$code" = "403"
      - name: Streaming endpoint ends in the same result, or a 403 error event
        run: |
          docker exec app python - <<'PY'
          import json, urllib.request
          from scripts.seed_demo_cache import sample_incidents
          samples = sample_incidents(open("app/static/app.js", encoding="utf-8").read())
          def stream(incident):
              req = urllib.request.Request(
                  "http://localhost:7860/triage/stream",
                  data=json.dumps({"incident": incident, "mode": "agent"}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              events, name = [], None
              for raw in urllib.request.urlopen(req, timeout=60):
                  line = raw.decode().strip()
                  if line.startswith("event:"):
                      name = line[6:].strip()
                  elif line.startswith("data:"):
                      events.append((name, json.loads(line[5:])))
              return events
          events = stream(next(iter(samples.values())))
          print([e for e, _ in events])
          assert events[0][0] == "started" and events[-1][0] == "result", events[-1]
          assert events[-1][1]["response"]["status"] == "ok"
          last = stream("a brand new incident that was never pre-computed")[-1]
          assert last[0] == "error" and last[1]["http_status"] == 403, last
          PY
      - name: UI is served
        run: curl -fsS localhost:7860/ | grep -q "Triagent"
      - name: Container logs
        if: always()
        run: docker logs app | tail -50
